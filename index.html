<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1020" />
    <title>Neon Wasteland Defense</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B1020'/%3E%3Cpath d='M16 5l9 5v12l-9 5-9-5V10z' fill='none' stroke='%2300E5FF' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23FF3DAE'/%3E%3C/svg%3E" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        display: block;
        outline: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0b1020;
        color: #dce7ff;
        font: 600 18px 'Segoe UI', Roboto, Arial, sans-serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 18px;
      }
      #rotate .phone {
        width: 46px;
        height: 78px;
        border: 3px solid #00e5ff;
        border-radius: 9px;
        box-shadow: 0 0 14px #00e5ff;
        animation: tilt 1.8s ease-in-out infinite;
      }
      @keyframes tilt {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      /* Touch devices held in portrait: ask for landscape (the game still runs underneath). */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
    <!-- Poki SDK (https://developers.poki.com/guide/sdk-html5). The game runs without it. -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate"><div class="phone"></div>Rotate your device to defend the reactor</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
